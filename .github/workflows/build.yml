name: Build Underlords Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Build Astro wiki
        id: astro
        continue-on-error: true
        run: npm run build
      - name: Publish build status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_OUTCOME: ${{ steps.astro.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ]; then
            state=success
            description="Astro wiki build passed"
          else
            state=failure
            description="Astro wiki build failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="wiki-build" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Fail workflow when Astro build fails
        if: steps.astro.outcome != 'success'
        run: exit 1
