name: Verify Run 1364 candidate

on:
  push:
    branches:
      - integrator/verify-miihi-run1364

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /underlords-wiki
      SITE_URL: https://bossmugen.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
